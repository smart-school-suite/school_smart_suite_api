name: Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: Image tag to deploy (commit SHA). Leave empty to use this workflow commit SHA.
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Resolve environment
        id: target
        shell: bash
        run: |
          set -e
          ENV="${{ inputs.environment }}"
          SHA="${{ inputs.image_tag }}"
          if [ -z "$SHA" ]; then
            SHA="${{ github.sha }}"
          fi

          if [ "$ENV" = "production" ]; then
            DEPLOY_DIR="/opt/school-smart"
            CONTAINER="school-smart-app"
          else
            DEPLOY_DIR="/opt/school-smart-staging"
            CONTAINER="school-smart-app-staging"
          fi

          {
            echo "environment=$ENV"
            echo "sha=$SHA"
            echo "deploy_dir=$DEPLOY_DIR"
            echo "container=$CONTAINER"
          } >> "$GITHUB_OUTPUT"

          echo "Deploying $ENV (image SHA=$SHA) to $DEPLOY_DIR as $CONTAINER"

      - name: Login to GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Write environment file from Infisical
        shell: bash
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: |
          set -e
          DEPLOY_DIR="${{ steps.target.outputs.deploy_dir }}"
          ENV_NAME="${{ steps.target.outputs.environment }}"
          mkdir -p "$DEPLOY_DIR"

          if [ "$ENV_NAME" = "production" ]; then
            INFISICAL_ENV="prod"
          else
            INFISICAL_ENV="staging"
          fi

          INFISICAL_TOKEN="$(infisical login --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" \
            --client-secret="$INFISICAL_CLIENT_SECRET" \
            --silent --plain)"
          echo "::add-mask::$INFISICAL_TOKEN"

          # Write to a temp file first so a failed export never replaces a working .env.
          TMP_ENV="$(mktemp "$DEPLOY_DIR/.env.XXXXXX")"
          trap 'rm -f "$TMP_ENV"' EXIT
          infisical export \
            --projectId="$INFISICAL_PROJECT_ID" \
            --env="$INFISICAL_ENV" \
            --token="$INFISICAL_TOKEN" \
            --format=dotenv > "$TMP_ENV"

          if ! grep -q '^APP_KEY=' "$TMP_ENV"; then
            echo "::error::Infisical export for '$INFISICAL_ENV' has no APP_KEY; keeping the existing .env"
            exit 1
          fi

          chmod 600 "$TMP_ENV"
          mv "$TMP_ENV" "$DEPLOY_DIR/.env"
          echo "Wrote $(grep -c '=' "$DEPLOY_DIR/.env") variables from Infisical ($INFISICAL_ENV)"

      - name: Deploy container
        shell: bash
        run: |
          set -e
          DEPLOY_DIR="${{ steps.target.outputs.deploy_dir }}"
          CONTAINER="${{ steps.target.outputs.container }}"
          TAG="${{ steps.target.outputs.sha }}"
          cd "$DEPLOY_DIR"

          REPO_LC="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${REPO_LC}:${TAG}"

          docker pull "$IMAGE"

          cat > docker-compose.yml <<EOF
          services:
            app:
              image: ${IMAGE}
              container_name: ${CONTAINER}
              restart: unless-stopped
              expose:
                - "80"
              env_file:
                - .env
              extra_hosts:
                - "host.docker.internal:host-gateway"
          networks:
            default:
              external: true
              name: proxy-network
          EOF

          docker compose up -d --force-recreate
          docker image prune -af || true
