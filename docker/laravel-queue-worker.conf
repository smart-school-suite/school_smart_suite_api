[program:laravel-queue-worker]
; Processes queued jobs: OTP and other emails, notifications, imports, statistics.
; --timeout stays below the database queue's retry_after (90s, config/queue.php)
; so a slow job is not picked up a second time while it is still running.
; --max-time restarts the worker hourly so it picks up memory and code changes.
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --timeout=80 --max-time=3600 --no-interaction
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=90
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
